# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
parameters:
    fallback_false: false
    resize_aliases:
        thumb: { w: 268 }
        lead: { w: 540 }
        poster: { w: 544 }
        square: { w: 320, h: 320 }

    asset_manifest_path: '%kernel.project_dir%/public/assets/manifest.json'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DataFixtures/'
            - '../src/Factory/'

    App\Comment\AkismetClient:
        arguments:
            $blog: https://chaostangent.com
            $apiKey: '%env(AKISMET_API_KEY)%'

    App\Comment\ChainDecider:
        arguments:
            $deciders:
                - '@App\Comment\HoneypotDecider'
                - '@App\Comment\TimeTakenDecider'
                - '@App\Comment\AkismetDecider'

    App\Comment\SpamDecider: '@App\Comment\ChainDecider'

    App\Controller\PostsController:
        arguments:
            $assetManifestPath: '%asset_manifest_path%'

    App\Extension\Twig\MediaExtension:
        arguments:
            $imageRepository: '@App\Image\CoreImageRepository'

    App\Form\DataTransformer\SignedDateTransformer:
        arguments:
            $key: '%env(APP_SECRET)%'

    App\Image\Action\ActionFactory:
        arguments:
            $resizeAliases: '%resize_aliases%'

    App\Image\FileHandler:
        arguments:
            $mediaDirectory: '%env(MEDIA_LOCATION)%'
            $mediaUrl: '/media/'

    App\Image\GatheringImageRepository:
        arguments:
            $decoratedImageRepository: '@App\Image\CoreImageRepository'

    App\Post\Processor\ExportProcessor:
        arguments:
            $outputDirectory: '%kernel.project_dir%/content'

    App\Repository\FeatureRepository:
        arguments:
            $features:
                comments: '%env(default:fallback_false:bool:FEATURE_COMMENTS)%'
                search: '%env(default:fallback_false:bool:FEATURE_SEARCH)%'

    App\Security\ApiKeyChecker:
        arguments:
            $apiKey: '%env(IMPORT_KEY)%'

    Intervention\Image\Interfaces\ImageManagerInterface:
        factory: [ 'Intervention\Image\ImageManager', 'withDriver' ]
        arguments:
            - 'Intervention\Image\Drivers\Imagick\Driver'

    Twig\Extension\StringLoaderExtension: ~

    # Feed defaults
    App\Extension\Serializer\Rss\Normaliser:
        arguments:
            $title: chaostangent.com
            $description: More squirrels than sense
            $generator: chaostangent.com
            $language: en-GB
            $updatePeriod: hourly
            $updateFrequency: 1

    App\Extension\Serializer\Atom\Normaliser:
        arguments:
            $title: chaostangent.com
            $subtitle: More squirrels than sense
            $generatorName: chaostangent.com

    App\Extension\Serializer\JsonLd\PostNormaliser:
        arguments:
            $title: chaostangent.com

when@test:
    services:
        App\Comment\ChainDecider:
            arguments:
                $deciders:
                    - '@App\Comment\StaticDecider'

        App\Comment\StaticDecider:
            arguments:
                $isSpam: false

        Intervention\Image\Interfaces\ImageManagerInterface:
            factory: [ 'Intervention\Image\ImageManager', 'withDriver' ]
            arguments:
                - 'Intervention\Image\Drivers\Gd\Driver'
